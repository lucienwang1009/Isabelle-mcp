[project]
name = "isabelle-mcp"
version = "0.2.0"
description = "MCP server exposing Isabelle/HOL to general-purpose LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "lucienwang1009", email = "yhwang1009@hotmail.com" }]
keywords = ["isabelle", "mcp", "llm", "theorem-proving", "hol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "anyio>=4.13.0",
    "httpx>=0.28.1",
    "mcp>=1.27.2",
]

[project.scripts]
isabelle-mcp = "isabelle_mcp.server:main"

[project.urls]
Homepage = "https://github.com/lucienwang1009/Isabelle-mcp"
Repository = "https://github.com/lucienwang1009/Isabelle-mcp"
Issues = "https://github.com/lucienwang1009/Isabelle-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["isabelle_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real Isabelle install",
    "heavy: needs ATPs and >60s budget (sledgehammer, etc.)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
