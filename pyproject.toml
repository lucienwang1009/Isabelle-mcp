[project]
name = "isabelle-mcp"
version = "0.0.0"
description = "MCP server exposing Isabelle/HOL to general-purpose LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = []
keywords = ["isabelle", "mcp", "llm", "theorem-proving", "hol"]
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.scripts]
isabelle-mcp = "isabelle_mcp.server:main"

[project.urls]
Homepage = "https://github.com/"
Issues = "https://github.com/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["isabelle_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real Isabelle install",
    "heavy: needs ATPs and >60s budget (sledgehammer, etc.)",
]
